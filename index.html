<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para mi amiga Jenny 🌼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#BCD6EE; --sky-mid:#DCE8F3; --sky-bottom:#EEF2D6;
    --glow:rgba(255,214,90,.55);
    --hill:#5E9A43; --hill-back:#7DB55A;
    --stem:#4E8A3A; --leaf:#6BAF4B;
    --petal:#FFCC2E; --petal-2:#FFDE6B; --gold:#F2A900; --center:#8A5314;
    --paper:#FFFBEA; --ink:#2F4A22; --ink-soft:#5B6B45;
    --hint:#2F4A22;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --sky-top:#1E2657; --sky-mid:#3B3874; --sky-bottom:#8A5A7E;
      --glow:rgba(255,196,60,.45);
      --hill:#2F5A2A; --hill-back:#3E6E33;
      --stem:#5C9A45; --leaf:#72B24F;
      --hint:#FFF1C2;
    }
  }
  :root[data-theme="dark"]{
    --sky-top:#1E2657; --sky-mid:#3B3874; --sky-bottom:#8A5A7E;
    --glow:rgba(255,196,60,.45);
    --hill:#2F5A2A; --hill-back:#3E6E33;
    --stem:#5C9A45; --leaf:#72B24F;
    --hint:#FFF1C2;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--sky-top)}
  body{
    margin:0;height:100%;overflow:hidden;
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-bottom) 100%);
    font-family:"Fraunces",Georgia,"Times New Roman",serif;color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .scene{position:relative;height:100%;overflow:hidden;cursor:default}
  .sun{
    position:absolute;top:6%;right:-60px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,var(--glow) 0%,transparent 68%);
    pointer-events:none;
  }
  #garden{position:absolute;left:0;right:0;bottom:0;width:100%;height:58%;display:block;pointer-events:none}
  .petals{position:absolute;inset:0;pointer-events:none;overflow:hidden}

  /* ---------- tarjeta ---------- */
  .stage{
    position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
    padding:max(5vh,20px) 20px 0;height:100%;
  }
  .card{
    all:unset;display:block;position:relative;cursor:pointer;
    width:min(84vw,340px);aspect-ratio:3/4;max-height:60vh;
    perspective:1200px;
  }
  .card:focus-visible{outline:3px solid var(--gold);outline-offset:6px;border-radius:22px}
  .flip{
    position:absolute;inset:0;transform-style:preserve-3d;
    transition:transform 1.1s cubic-bezier(.4,.1,.2,1);
  }
  .card.is-open .flip{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:22px;background:var(--paper);
    box-shadow:0 18px 40px -18px rgba(40,30,60,.55),0 2px 0 rgba(255,255,255,.6) inset;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:26px 22px;overflow:hidden;
  }
  .face::before{ /* borde interior tipo tarjeta */
    content:"";position:absolute;inset:10px;border-radius:14px;
    border:1.5px dashed rgba(242,169,0,.55);pointer-events:none;
  }
  .front{
    background:
      radial-gradient(circle at 50% 42%,#FFE58A 0%,#FFD23F 45%,#F5B400 100%);
  }
  .front::before{border-color:rgba(255,255,255,.7)}
  .front h2{
    font-style:italic;font-weight:600;font-size:clamp(1.7rem,7vw,2.2rem);
    line-height:1.1;margin:18px 0 6px;color:#5A3A08;
  }
  .front .tap{
    font-family:"Caveat",cursive;font-size:1.35rem;color:#7A4E0A;margin:0;
    animation:nudge 2.2s ease-in-out infinite;
  }
  .seal{width:46%;max-width:150px;animation:spin 18s linear infinite}
  .back{transform:rotateY(180deg)}
  .back .mini{width:64px;margin-bottom:6px}
  .back h1{
    font-weight:400;font-size:clamp(1.6rem,7.2vw,2.15rem);line-height:1.12;
    margin:4px 0 10px;letter-spacing:-.01em;
  }
  .back .thanks{
    font-family:"Caveat",cursive;font-weight:700;font-size:clamp(2.1rem,10vw,2.8rem);
    color:var(--gold);margin:0 0 12px;line-height:1;
    text-shadow:0 1px 0 #fff;
  }
  .back .note{font-size:1rem;line-height:1.55;color:var(--ink-soft);margin:0 0 14px;max-width:26ch}
  .back .sign{font-family:"Caveat",cursive;font-size:1.4rem;margin:0}
  .back > *{opacity:0;transform:translateY(8px);transition:opacity .6s ease,transform .6s ease}
  .card.is-open .back > *{opacity:1;transform:none}
  .card.is-open .back > :nth-child(1){transition-delay:1.0s}
  .card.is-open .back > :nth-child(2){transition-delay:1.25s}
  .card.is-open .back > :nth-child(3){transition-delay:1.6s}
  .card.is-open .back > :nth-child(4){transition-delay:1.9s}
  .card.is-open .back > :nth-child(5){transition-delay:2.2s}

  .hint{
    font-family:"Caveat",cursive;font-size:1.25rem;color:var(--hint);
    margin:14px 0 0;opacity:0;transition:opacity .8s ease 3.4s;text-align:center;
  }
  body.open .hint{opacity:.9}

  /* ---------- flores ---------- */
  .stem{fill:none;stroke:var(--stem);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
  .leaf{fill:var(--leaf);transform:scale(0);transform-box:fill-box;transform-origin:0% 50%}
  .head{transform:scale(0) rotate(-120deg);transform-box:fill-box;transform-origin:center}
  body.open .stem{animation:grow 1.5s cubic-bezier(.3,.6,.3,1) forwards}
  body.open .leaf{animation:pop .7s ease-out forwards}
  body.open .head{animation:bloom 1.1s cubic-bezier(.3,1.45,.5,1) forwards}
  .sway{transform-box:view-box;animation:sway 5s ease-in-out infinite alternate}

  .petal{
    position:absolute;top:-30px;width:14px;height:10px;
    background:linear-gradient(135deg,#FFE27A,#FFC21A);
    border-radius:80% 0 80% 0;opacity:.95;
    animation:fall linear forwards;
  }

  @keyframes grow{to{stroke-dashoffset:0}}
  @keyframes pop{to{transform:scale(1)}}
  @keyframes bloom{to{transform:scale(1) rotate(0deg)}}
  @keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes fall{
    0%{transform:translate(0,0) rotate(0)}
    100%{transform:translate(var(--drift),110vh) rotate(var(--rot))}
  }

  @media (prefers-reduced-motion: reduce){
    .seal,.front .tap,.sway{animation:none}
    .flip{transition:none}
    body.open .stem{animation:none;stroke-dashoffset:0}
    body.open .leaf,body.open .head{animation:none;transform:none}
    .back > *{transition:none}
    .hint{transition:none}
  }
</style>
</head>
<body>
<main class="scene" id="scene">
  <div class="sun" aria-hidden="true"></div>
  <svg id="garden" aria-hidden="true"></svg>
  <div class="petals" id="petals" aria-hidden="true"></div>

  <div class="stage">
    <button class="card" id="card" aria-label="Abrir tarjeta para Jenny">
      <div class="flip">
        <div class="face front">
          <svg class="seal" viewBox="-60 -60 120 120" aria-hidden="true" id="seal"></svg>
          <h2>Una flor amarilla para ti</h2>
          <p class="tap">toca para abrir</p>
        </div>
        <div class="face back">
          <svg class="mini" viewBox="-40 -40 80 80" aria-hidden="true" id="mini"></svg>
          <h1>Para mi amiga Jenny!!</h1>
          <p class="thanks">Gracias por todo.</p>
          <p class="note">Feliz día de las flores amarillas. Que nunca te falten motivos para sonreír.</p>
          <p class="sign">Con cariño 💛</p>
        </div>
      </div>
    </button>
    <p class="hint">toca la pantalla para que crezcan más flores</p>
  </div>
</main>

<script>
(function(){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (a,b)=>a+Math.random()*(b-a);
  const garden = document.getElementById('garden');
  const card = document.getElementById('card');
  const scene = document.getElementById('scene');
  let W=0,H=0,extra=0;

  /* ---- cabezas de flor ---- */
  function daisy(s){
    const n=14; let p='';
    for(let i=0;i<n;i++){
      p+=`<ellipse cx="0" cy="${-s*.56}" rx="${s*.19}" ry="${s*.5}" transform="rotate(${i*360/n})" fill="var(--petal)"/>`;
    }
    for(let i=0;i<n;i++){
      p+=`<ellipse cx="0" cy="${-s*.42}" rx="${s*.11}" ry="${s*.32}" transform="rotate(${i*360/n+12.8})" fill="var(--petal-2)"/>`;
    }
    p+=`<circle r="${s*.3}" fill="var(--center)"/><circle r="${s*.17}" fill="#A86A1E"/>`;
    return p;
  }
  function marigold(s){
    const cols=['var(--gold)','#FFBE1A','var(--petal-2)']; let p='';
    for(let k=0;k<3;k++){
      const r=s*(1-k*.3), n=11-k*2;
      for(let i=0;i<n;i++){
        p+=`<circle cx="0" cy="${-r*.58}" r="${r*.42}" transform="rotate(${i*360/n+k*17})" fill="${cols[k]}"/>`;
      }
    }
    p+=`<circle r="${s*.16}" fill="#E08A00"/>`;
    return p;
  }
  function tulip(s){
    return `<path d="M${-s*.55} ${-s*.1} C${-s*.6} ${s*.55},${s*.6} ${s*.55},${s*.55} ${-s*.1} L${s*.3} ${-s*.6} L${s*.12} ${-s*.25} L0 ${-s*.7} L${-s*.12} ${-s*.25} L${-s*.3} ${-s*.6} Z" fill="var(--petal)"/>
            <path d="M${-s*.1} ${-s*.2} C${-s*.2} ${s*.3},${s*.2} ${s*.3},${s*.1} ${-s*.2} L0 ${-s*.62} Z" fill="var(--gold)" opacity=".55"/>`;
  }

  function flower(x,base,hgt,size,type,delay){
    const bend=rand(-26,26);
    const hx=x+bend*.6, hy=base-hgt;
    const cx=x+bend, cy=base-hgt*.5;
    const t=rand(.3,.5);
    const lx=(1-t)*(1-t)*x+2*(1-t)*t*cx+t*t*hx;
    const ly=(1-t)*(1-t)*base+2*(1-t)*t*cy+t*t*hy;
    const side=Math.random()<.5?1:-1;
    const lang=side>0?rand(-40,-15):rand(195,220);
    const ls=size/20;
    const head = type===0?daisy(size):type===1?marigold(size):tulip(size*.9);
    return `<g class="sway" style="transform-origin:${x}px ${base}px;animation-duration:${rand(3.5,6).toFixed(2)}s;animation-delay:${(-rand(0,5)).toFixed(2)}s">
      <path class="stem" pathLength="1" d="M${x} ${base} Q${cx} ${cy} ${hx} ${hy}" style="animation-delay:${delay.toFixed(2)}s"/>
      <g transform="translate(${lx.toFixed(1)} ${ly.toFixed(1)}) rotate(${lang.toFixed(0)}) scale(${ls.toFixed(2)})">
        <path class="leaf" d="M0 0 C7 -8,18 -8,26 0 C18 7,7 7,0 0Z" style="animation-delay:${(delay+.6).toFixed(2)}s"/>
      </g>
      <g transform="translate(${hx.toFixed(1)} ${hy.toFixed(1)})">
        <g class="head" style="animation-delay:${(delay+1.1).toFixed(2)}s">${head}</g>
      </g>
    </g>`;
  }

  function hills(){
    return `<path d="M0 ${H} L0 ${H-34} Q${W*.3} ${H-62} ${W*.62} ${H-38} T${W} ${H-44} L${W} ${H} Z" fill="var(--hill-back)"/>
            <path d="M0 ${H} L0 ${H-14} Q${W*.45} ${H-40} ${W} ${H-12} L${W} ${H} Z" fill="var(--hill)"/>`;
  }

  function build(){
    W=garden.clientWidth; H=garden.clientHeight;
    garden.setAttribute('viewBox',`0 0 ${W} ${H}`);
    const count=Math.max(9,Math.round(W/30));
    const list=[];
    for(let i=0;i<count;i++){
      const x=(i+.5)*W/count+rand(-10,10);
      list.push({x,hgt:H*rand(.32,.88),size:rand(15,25),type:Math.floor(Math.random()*3),delay:.4+rand(0,1.4)});
    }
    list.sort((a,b)=>b.hgt-a.hgt);
    let back='',front='';
    list.forEach((f,i)=>{
      const g=flower(f.x,H-20,f.hgt,f.size,f.type,f.delay);
      if(i<list.length*.55) back+=g; else front+=g;
    });
    garden.innerHTML=`<g>${back}</g>${hills()}<g id="front">${front}</g>`;
  }

  /* sello de la portada y flor mini */
  document.getElementById('seal').innerHTML=`<g transform="scale(1.9)">${marigold(28)}</g>`;
  document.getElementById('mini').innerHTML=daisy(30);

  /* pétalos cayendo */
  function dropPetal(){
    const box=document.getElementById('petals');
    const p=document.createElement('span');
    p.className='petal';
    p.style.left=rand(0,100)+'vw';
    p.style.setProperty('--drift',rand(-80,80)+'px');
    p.style.setProperty('--rot',rand(240,720)+'deg');
    p.style.animationDuration=rand(6,11)+'s';
    const sc=rand(.7,1.4); p.style.width=14*sc+'px'; p.style.height=10*sc+'px';
    p.addEventListener('animationend',()=>p.remove());
    box.appendChild(p);
  }

  function openCard(){
    if(card.classList.contains('is-open')) return;
    card.classList.add('is-open');
    card.setAttribute('aria-label','Tarjeta para Jenny, abierta');
    document.body.classList.add('open');
    if(!reduce){
      for(let i=0;i<6;i++) setTimeout(dropPetal,1200+i*350);
      setInterval(dropPetal,700);
    }
  }
  card.addEventListener('click',e=>{e.stopPropagation();openCard();});

  /* tocar la pantalla para que brote una flor */
  scene.addEventListener('click',e=>{
    if(!document.body.classList.contains('open')||extra>70) return;
    const r=garden.getBoundingClientRect();
    const x=e.clientX-r.left;
    const g=document.getElementById('front');
    const wrap=document.createElementNS('http://www.w3.org/2000/svg','g');
    wrap.innerHTML=flower(x,H-16,H*rand(.25,.6),rand(14,22),Math.floor(Math.random()*3),0);
    g.appendChild(wrap.firstElementChild);
    extra++;
  });

  build();
  let rt;
  window.addEventListener('resize',()=>{
    clearTimeout(rt);
    rt=setTimeout(()=>{ if(Math.abs(garden.clientWidth-W)>40) build(); },300);
  });
})();
</script>
</body>
</html>
